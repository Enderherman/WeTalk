#云端部署模板
spring:
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/easychat?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置（Spring Boot 默认就是 Hikari）
    hikari:
      pool-name: HikariCPDatasource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  # Redis配置
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      # spring.data.redis.password=1234
      timeout: 2s
      # Redis连接池配置
      lettuce:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 10
          min-idle: 0
      connect-timeout: 2000
# 项目目录
project:
  folder: /tmp/WeTalk

# 超级管理员id
admin:
  emails: Enderherman@outlook.com

