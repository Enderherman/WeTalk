spring:
  application:
    name: WeTalk
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    headless: true
  mvc:
    async:
      request-timeout: 180000
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${MAX_UPLOAD_SIZE:500MB}
      location: ${java.io.tmpdir}
  web:
    resources:
      add-mappings: false
  ai:
    model:
      chat: ${WETALK_AI_MODEL:none}
      embedding: none
    chat:
      client:
        enabled: ${WETALK_AI_ENABLED:false}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-chat}
          temperature: 0.7
          max-tokens: 2048
    retry:
      max-attempts: 3
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/wetalk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:wetalk}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
      connect-timeout: 2s

server:
  port: ${HTTP_PORT:5050}
  servlet:
    context-path: /api
  shutdown: graceful

ws:
  port: ${WS_PORT:5051}
project:
  folder: ${PROJECT_FOLDER:./data/}
admin:
  emails: ${ADMIN_EMAILS:}
wetalk:
  ai:
    enabled: ${WETALK_AI_ENABLED:false}
  web:
    auth-cookie-secure: ${WETALK_WEB_AUTH_COOKIE_SECURE:false}
    allowed-origins: "${WETALK_WEB_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,websocket
dev: false
