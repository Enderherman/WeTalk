spring:
  application:
    name: WeTalk
  profiles:
    active: dev
  config:
    import: optional:application-ai.yml
  # 增加连接和读取超时时间
  mvc:
    async:
      request-timeout: 180000
  # 关闭favicon请求
  # web:
  #   favicon:
  #     enabled: false
  # 最大文件限制
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      location: ${java.io.tmpdir}
      enabled: true
      file-size-threshold: 0
      resolve-lazily: false
    # session过期时间
    session:
      timeout: PT60M
  # 错误处理：请求无匹配时抛异常
  web:
    resources:
      add-mappings: false
  # springAi配置
  ai:
    openai:
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          maxTokens: 2048
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1000
        multiplier: 2
    timeout: 30s
# 服务端与 Web 容器配置
server:
  port: 5050
  tomcat:
    connection-timeout: 180000
    max-http-form-post-size: 500MB
  servlet:
    context-path: /api
    session:
      timeout: PT60M

# 是否是开发环境
dev: false

# ws.port
ws:
  port: 5051
